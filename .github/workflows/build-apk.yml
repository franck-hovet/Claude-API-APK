name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - app.zip

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Lire app.zip
        run: unzip -q app.zip -d app

      - name: Préparer le projet Android
        working-directory: app
        run: |
          npm install
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#C6613F' --iconBackgroundColorDark '#C6613F' || echo 'Icone par defaut'
          npx cap sync android

      - name: Compiler l'APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: chat-api-apk
          path: app/android/app/build/outputs/apk/debug/*.apk
